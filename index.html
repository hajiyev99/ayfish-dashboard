<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// Crosshair plugin for better hover interactivity
const crosshairPlugin = {
  id: 'crosshair',
  afterDraw(chart) {
    if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
      const activePoint = chart.tooltip._active[0];
      const ctx = chart.ctx;
      const x = activePoint.element.x;
      const topY = chart.chartArea.top;
      const bottomY = chart.chartArea.bottom;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, topY);
      ctx.lineTo(x, bottomY);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(99, 179, 237, 0.3)';
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.restore();
    }
  }
};
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#e2e8f0; min-height:100vh; }

/* ── HEADER ─────────────────────────────────────────────────── */
.header {
  background:linear-gradient(135deg,#0e1726,#162035);
  padding:16px 36px 0; border-bottom:1px solid #1e2d45;
}
.header-top {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
}
.header h1 { font-size:20px; font-weight:700; color:#63b3ed; }
.header-meta { font-size:12px; color:#4a6080; margin-top:2px; }
.header-right { display:flex; align-items:center; gap:12px; }
.report-date { font-size:12px; font-weight:600; color:#76b5d8; }
.refresh-btn {
  background:#1e2d45; border:1px solid #2d4a6a; color:#a0c4e8;
  padding:6px 14px; border-radius:7px; cursor:pointer; font-size:12px; transition:background .2s;
}
.refresh-btn:hover { background:#2d4a6a; }
.refresh-btn:disabled { opacity:.5; cursor:not-allowed; }

/* ── TABS ────────────────────────────────────────────────────── */
.tab-bar { display:flex; gap:0; }
.tab-btn {
  padding:10px 28px; cursor:pointer; border:none; background:transparent;
  font-size:13px; font-weight:600; color:#4a6080;
  border-bottom:3px solid transparent; transition:all .2s; white-space:nowrap;
}
.tab-btn:hover { color:#a0c4e8; }
.tab-btn.active-etas { color:#63b3ed; border-bottom-color:#63b3ed; }
.tab-btn.active-kark { color:#68d391; border-bottom-color:#68d391; }
.tab-btn.active-fin { color:#f6ad55; border-bottom-color:#f6ad55; }
.tab-btn.active-mort { color:#fc8181; border-bottom-color:#fc8181; }

/* ── LAYOUT ─────────────────────────────────────────────────── */
.page { display:none; padding:28px 36px; max-width:1480px; margin:0 auto; }
.page.active { display:block; }

/* ── SECTION LABELS ──────────────────────────────────────────── */
.section-label {
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
  color:#4a6080; margin-bottom:14px; margin-top:32px; display:flex; align-items:center; gap:8px;
}
.section-label::after { content:''; flex:1; height:1px; background:#1a2a3a; }
.section-label:first-child { margin-top:0; }

/* ── KPI CARDS ───────────────────────────────────────────────── */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px; margin-bottom:20px; }
.kpi-card { background:#111927; border:1px solid #1e2d40; border-radius:12px; padding:14px 16px; position:relative; overflow:hidden; }
.kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.kpi-temp::before  { background:linear-gradient(90deg,#fc8181,#f6ad55); }
.kpi-oxy::before   { background:linear-gradient(90deg,#63b3ed,#76e4f7); }
.kpi-mort::before  { background:linear-gradient(90deg,#e53e3e,#fc8181); }
.kpi-feed::before  { background:linear-gradient(90deg,#b794f4,#d6bcfa); }
.kpi-bio::before   { background:linear-gradient(90deg,#f6ad55,#fbd38d); }
.kpi-hasat::before { background:linear-gradient(90deg,#76e4f7,#63b3ed); }
.kpi-yem::before   { background:linear-gradient(90deg,#9ae6b4,#38a169); }

.kpi-lbl  { font-size:10px; color:#4a6080; text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; }
.kpi-val  { font-size:24px; font-weight:700; color:#f0f4f8; line-height:1; }
.kpi-unit { font-size:11px; color:#4a6080; margin-left:2px; }
.kpi-tr   { font-size:11px; margin-top:6px; }
.tr-good   { color:#68d391; }
.tr-bad    { color:#fc8181; }
.tr-stable { color:#4a6080; }

/* ── CHARTS ──────────────────────────────────────────────────── */
.charts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:14px; }
.chart-card { background:#111927; border:1px solid #1e2d40; border-radius:12px; padding:16px 18px; }
.chart-title { font-size:12px; font-weight:600; color:#718096; margin-bottom:12px; }
.chart-wrap  { position:relative; height:175px; cursor:crosshair; }

/* ── DATE RANGE BAR ──────────────────────────────────────────── */
.range-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:4px 0 12px; }
.range-lbl { font-size:11px; color:#4a6080; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-right:2px; }
.range-btn {
  background:#111927; border:1px solid #1e2d40; color:#718096;
  padding:4px 12px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:600; transition:all .15s;
}
.range-btn:hover { border-color:#2d4a6a; color:#a0c4e8; }
.range-btn.active { background:#1e2d45; border-color:#63b3ed; color:#63b3ed; }
.range-date {
  background:#0a1119; border:1px solid #1e2d40; color:#a0c4e8; padding:3px 8px;
  border-radius:6px; font-size:11px; font-family:inherit; color-scheme:dark;
}
.range-date:focus { outline:none; border-color:#2d4a6a; }

/* ── BIOMASS WEIGHT BREAKDOWN ────────────────────────────────── */
.bio-panels { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:4px; }
@media(max-width:900px){ .bio-panels { grid-template-columns:1fr; } }

.bio-panel { background:#111927; border:1px solid #1e2d40; border-radius:12px; overflow:hidden; }
.bio-panel-head {
  display:flex; align-items:center; gap:9px;
  padding:12px 18px; border-bottom:1px solid #1a2a3a; background:#0d1520;
}
.bio-icon { font-size:16px; }
.bio-title { font-size:13px; font-weight:700; color:#a0c4e8; flex:1; }
.bio-badge {
  font-size:11px; font-weight:700; color:#68d391;
  background:#0a2e1a; padding:3px 10px; border-radius:20px;
}
.bio-sub { font-size:10px; color:#4a6080; padding:8px 18px 6px; border-bottom:1px solid #111d2a; }

/* Weight rows */
.wb-table { width:100%; padding:6px 18px 14px; }
.wb-row { display:grid; grid-template-columns:100px 1fr 90px; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid #111d28; }
.wb-row:last-child { border-bottom:none; }
.wb-label { font-size:11px; color:#718096; white-space:nowrap; }
.wb-bars { display:flex; flex-direction:column; gap:3px; }
.wb-bar-wrap { display:flex; align-items:center; gap:6px; }
.wb-track { flex:1; height:5px; background:#151f2e; border-radius:3px; overflow:hidden; }
.wb-fill-count { height:100%; background:#63b3ed; border-radius:3px; min-width:1px; }
.wb-fill-kg    { height:100%; background:#f6ad55; border-radius:3px; min-width:1px; }
.wb-tiny { font-size:10px; color:#4a6080; white-space:nowrap; width:90px; text-align:right; }
.wb-vals { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
.wb-count-val { font-size:11px; color:#63b3ed; font-weight:600; }
.wb-kg-val    { font-size:11px; color:#f6ad55; font-weight:600; }

/* Sterlet summary */
.sterlet-summary { padding:16px 18px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.st-stat { text-align:center; }
.st-stat-val { font-size:20px; font-weight:700; color:#e2e8f0; }
.st-stat-lbl { font-size:10px; color:#4a6080; text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }

/* ── HASAT ────────────────────────────────────────────────────── */
.hasat-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
@media(max-width:900px){ .hasat-grid { grid-template-columns:1fr; } }

.hasat-table-card { background:#111927; border:1px solid #1e2d40; border-radius:12px; overflow:hidden; }
.hasat-table-title { font-size:12px; font-weight:600; color:#718096; padding:13px 18px 10px; border-bottom:1px solid #1a2a3a; }

table { width:100%; border-collapse:collapse; }
th { font-size:10px; font-weight:700; color:#4a6080; text-transform:uppercase; letter-spacing:.06em; padding:8px 14px; text-align:left; background:#0d1520; }
td { font-size:12px; color:#c4d4e8; padding:8px 14px; border-top:1px solid #131d2a; }
tr:hover td { background:#131d2a; }
.td-kg   { font-weight:700; color:#68d391; text-align:right; }
.td-cust { font-weight:600; }
.td-others { color:#718096; font-style:italic; }

.share-bar-wrap { display:flex; align-items:center; gap:6px; }
.share-bar { height:5px; background:#68d391; border-radius:3px; min-width:1px; }
.share-pct { font-size:11px; color:#4a6080; white-space:nowrap; }

/* ── STATES ──────────────────────────────────────────────────── */
.loading { display:flex; align-items:center; justify-content:center; min-height:120px; gap:12px; color:#4a6080; font-size:13px; }
.spin { width:20px; height:20px; border:3px solid #1e2d40; border-top-color:#63b3ed; border-radius:50%; animation:spin .8s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.err { background:#2d1515; border:1px solid #742020; border-radius:10px; padding:14px; color:#fc8181; font-size:13px; margin-bottom:14px; }

/* ── FINANCIAL TAB ──────────────────────────────────────────── */
.fin-section { margin-bottom:32px; }
.fin-section-title { font-size:13px; font-weight:700; color:#f6ad55; margin-bottom:14px; }
.fin-section-note { font-size:11px; color:#4a6080; margin-bottom:12px; }
.fin-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
.fin-card { background:#111927; border:1px solid #1e2d40; border-radius:12px; padding:14px 16px; }
.fin-card.card-label { font-size:10px; color:#4a6080; text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; }
.fin-input-card { background:#0d1520; border:1px solid #2d4a6a; border-radius:10px; padding:12px; }
.fin-input-label { font-size:10px; color:#4a6080; text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; }
.fin-input { width:100%; background:#0a1119; border:1px solid #1e2d40; color:#e2e8f0; padding:8px 10px; font-size:13px; border-radius:6px; font-family:inherit; }
.fin-input:focus { outline:none; border-color:#f6ad55; box-shadow:0 0 0 2px rgba(246,173,85,0.1); }
.fin-display { font-size:11px; color:#4a6080; margin-top:6px; }
.fin-value { font-size:18px; font-weight:700; color:#e2e8f0; margin-top:6px; }
.fin-link-btn { background:#2d4a6a; border:1px solid #3d5a7a; color:#a0c4e8; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:11px; text-decoration:none; display:inline-block; transition:all .2s; white-space:nowrap; }
.fin-link-btn:hover { background:#3d5a7a; color:#e2e8f0; }
.fin-total-card { background:linear-gradient(135deg,#111927,#1a2a3a); border:2px solid #f6ad55; border-radius:12px; padding:24px; margin-top:24px; }
.fin-total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #1e2d40; }
.fin-total-row:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.fin-total-label { font-size:12px; color:#4a6080; text-transform:uppercase; letter-spacing:.05em; }
.fin-total-val { font-size:16px; font-weight:700; color:#e2e8f0; text-align:right; }
.fin-grand-total { background:#0d1520; border:1px solid #f6ad55; border-radius:10px; padding:20px; text-align:center; margin-top:16px; }
.fin-grand-label { font-size:11px; color:#4a6080; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
.fin-grand-value { font-size:42px; font-weight:900; line-height:1; margin-bottom:6px; }
.fin-grand-value.positive { color:#68d391; }
.fin-grand-value.negative { color:#fc8181; }
.fin-grand-value.neutral { color:#f6ad55; }
.fin-zero { color:#4a6080; }

.footer { text-align:center; padding:18px; font-size:11px; color:#2d4060; border-top:1px solid #131929; margin-top:20px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>🐟 Farm Monitoring Dashboard</h1>
      <div class="header-meta" id="updated">Initialising…</div>
    </div>
    <div class="header-right">
      <div class="report-date" id="report-date"></div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">⟳ Refresh</button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active-etas" id="tab-etas" onclick="showPage('etas')">🔵 ETAS 26 — Elazig</button>
    <button class="tab-btn" id="tab-kark" onclick="showPage('kark')">🟢 Karkamish 26 — Gaziantep</button>
    <button class="tab-btn" id="tab-mort" onclick="showPage('mort')">📉 Mortality & Stock</button>
    <button class="tab-btn" id="tab-fin" onclick="showPage('fin')">💰 Financial Overview</button>
  </div>
</div>

<div class="page active" id="page-etas">
  <div class="loading"><div class="spin"></div>Loading ETAS 26…</div>
</div>
<div class="page" id="page-kark">
  <div class="loading"><div class="spin"></div>Loading Karkamish 26…</div>
</div>
<div class="page" id="page-mort">
  <div class="loading"><div class="spin"></div>Loading Mortality Rate…</div>
</div>
<div class="page" id="page-fin">
  <div class="loading"><div class="spin"></div>Loading Financial Overview…</div>
</div>

<div class="footer">Auto-refreshes every 30 min · Shows latest available data (falls back to last entry if yesterday is blank)</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const API_KEY = 'AIzaSyBOBksJoCH-mXWXuXxR83dySUCplIPt4K8';

// ── TAB SWITCHING ──────────────────────────────────────────────────────────
let activePage = 'etas';
function showPage(pid) {
  activePage = pid;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+pid).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => { b.className='tab-btn'; });
  document.getElementById('tab-'+pid).classList.add('active-'+pid);
  document.getElementById('refreshBtn').style.display = (pid === 'fin' || pid === 'mort') ? 'none' : '';
  if(pid === 'fin') {
    loadFinancial();
  } else if(pid === 'mort') {
    loadMortality();
  } else if (rangeState[pid] && rangeState[pid].redraw) {
    // Charts created while this tab was hidden rendered into a 0-size canvas — redraw on reveal.
    rangeState[pid].redraw();
  }
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function parseNum(v) {
  if (v == null || v === '' || v === '-' || v === '.') return null;
  const s = String(v).trim();
  if (!s) return null;
  const cleaned = s.includes(',')
    ? s.replace(/\./g, '').replace(',', '.')
    : s.replace(/\./g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}
function colVal(row, idx) {
  if (idx < 0 || idx >= row.length) return null;
  return parseNum(row[idx]);
}
// ETAS 26 workbook is en_US locale (comma=thousands, dot=decimal); the rest of the
// dashboard expects tr_TR strings. Convert numeric-looking cells on the API response
// before downstream parsing. Leaves dates ("20.04.2026"), text, and ranges alone.
function enToTrCell(v) {
  if (typeof v !== 'string') return v;
  const s = v.trim();
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return s.replace(/,/g,'').replace('.',',');
  if (/^-?\d+\.\d+$/.test(s)) return s.replace('.',',');
  return v;
}
function normalizeETAS(rows) {
  return Array.isArray(rows) ? rows.map(r => Array.isArray(r) ? r.map(enToTrCell) : r) : rows;
}
// ── CAGE-LEVEL AGGREGATION ─────────────────────────────────────────────────
// As of 11 May 2026 both farms log mortality + feed per-cage via the new cage tracker
// (Karkamış: deployed 06.05; Elazığ: mid-deployment with stale gaps per Saman's logging).
// `Olum-kafes baz` (col D = Ölüm adet) and `Yem-kafes baz` (col F = Yem kg) are the
// PRIMARY sources for mortality + feed. Günlük/GÜNLÜK is now an audit/fallback tool only.
function cageDateToISO(s) {
  if (!s) return null;
  const m = String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return null;
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function gunlukDateToISO(s, year) {
  if (!s) return null;
  const m = String(s).trim().match(/^(\d{1,2})\s*([A-Za-zĞŞÜĞçşöğüı]+)$/);
  if (!m) return null;
  const months = {
    Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12',
    Oca:'01',Şub:'02',Nis:'04',Haz:'06',Tem:'07',Ağu:'08',Eyl:'09',Eki:'10',Kas:'11',Ara:'12'
  };
  const mm = months[m[2]];
  if (!mm) return null;
  return `${year}-${mm}-${m[1].padStart(2,'0')}`;
}
function aggCageByDate(rows, valColIdx) {
  const out = {};
  for (let i = 1; i < (rows||[]).length; i++) {
    const r = rows[i]; if (!r || !r[0]) continue;
    const k = cageDateToISO(r[0]); if (!k) continue;
    const v = parseNum(r[valColIdx]); if (v == null) continue;
    out[k] = (out[k] || 0) + v;
  }
  return out;
}
function lastCageDate(map) {
  const keys = Object.keys(map||{});
  if (!keys.length) return null;
  return keys.sort().pop();
}
function latestVal(arr) { return [...(arr||[])].reverse().find(v=>v!==null)??null; }
// Find last non-blank row index in dataRows for a given column set
function findLastDataRow(dataRows, colIndices) {
  for (let i = dataRows.length - 1; i >= 0; i--) {
    const r = dataRows[i];
    const hasAny = colIndices.some(ci => r[ci] && String(r[ci]).trim() !== '' && String(r[ci]).trim() !== '0');
    if (hasAny) return i;
  }
  return -1;
}
function trendDir(arr) {
  const n=(arr||[]).filter(v=>v!==null);
  if(n.length<6) return 'stable';
  const r=n.slice(-4).reduce((a,b)=>a+b,0)/4;
  const p=n.slice(-8,-4).reduce((a,b)=>a+b,0)/4;
  if(!p) return 'stable';
  const d=(r-p)/Math.abs(p);
  return d>0.02?'up':d<-0.02?'down':'stable';
}
function fmtN(v,dec=0) {
  const n=parseNum(v);
  return n!=null?n.toLocaleString('tr-TR',{maximumFractionDigits:dec}):'—';
}
function fmtKg(v)  { const n=parseNum(v); return n!=null?Math.round(n).toLocaleString('tr-TR'):'—'; }
function fmtCnt(v) { const n=parseNum(v); return n!=null?Math.round(n).toLocaleString('tr-TR'):'—'; }
// Weights are stored in kg; show tonnes for large totals to avoid "811 kg" misreads (811 t).
function fmtTonnes(kg){ const n=parseNum(kg); if(n==null) return '—';
  return n>=1000 ? (n/1000).toLocaleString('tr-TR',{maximumFractionDigits:1})+' t'
                 : Math.round(n).toLocaleString('tr-TR')+' kg'; }
function getYesterday() { const d=new Date(); d.setDate(d.getDate()-1); return d; }
function parseHasatDate(str,fmt) {
  if(!str||!str.trim()) return null;
  const s=str.trim();
  try {
    if(fmt==='DD/MM/YYYY'){ const[d,m,y]=s.split('/'); return new Date(+y,+m-1,+d); }
    else if(fmt==='DD.MM.YYYY'){ const[d,m,y]=s.split('.'); return new Date(+y,+m-1,+d); }
    else { const[d,m,y]=s.split('.'); return new Date(2000+(+y),+m-1,+d); }
  } catch { return null; }
}
function monthKey(dt) {
  if(!dt) return null;
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
}
const TR_MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

// ── CHART FACTORY ──────────────────────────────────────────────────────────
Chart.register(crosshairPlugin);
const charts={};
function makeChart(cid,labels,datasets,type='line',opts={}) {
  if(charts[cid]) charts[cid].destroy();
  const ctx=document.getElementById(cid);
  if(!ctx) return;
  // Determine unit from chart title context
  const unitMap = {'count':'fish','tonnes':'t','temp':'°C','oxy':'mg/L','mort':'fish','feed':'kg','hasat':'kg','bio':'kg'};
  const chartKey = Object.keys(unitMap).find(k => cid.toLowerCase().includes(k)) || '';
  const unit = unitMap[chartKey] || '';
  charts[cid]=new Chart(ctx,{
    type, data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:350},
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{display:datasets.length>1,labels:{color:'#718096',font:{size:10},boxWidth:10,padding:8}},
        tooltip:{
          enabled:true,
          backgroundColor:'rgba(13,23,36,0.95)',
          borderColor:'#2d4a6a',borderWidth:1,

// ── API ────────────────────────────────────────────────────────────────────
function api(id,tab) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(tab)}?key=${API_KEY}`;
  return fetch(url)
    .then(r=>{
      if(!r.ok) return r.json().then(j=>{throw new Error(`Sheet "${tab}": ${j.error?.message||r.statusText} (${r.status})`)});
      return r.json();
    })
    .then(j=>{if(j.error)throw new Error(`Sheet "${tab}": ${j.error.message}`);return j.values||[];})
    .catch(e=>{
      if(e.message.includes('Sheet "')) throw e;
      throw new Error(`Sheet "${tab}": Network error — ${e.message}. Make sure you open this file directly in Chrome (not in a preview panel).`);
    });
}

// ── BIOMASS COMPUTATION ────────────────────────────────────────────────────
function computeBioTotals(somonRows, mersinRows) {
  // Somon (v2 layout): find TOPLAM row (c0='TOPLAM'); Kilo columns are 3,7,9,11,15,17,19
  // (summary table has gap cols E/G/M/O — Adet/Kilo pairs for buckets 0-200g … 3500+g are NOT contiguous)
  const st = somonRows.find(r=>r[0]&&String(r[0]).trim().toUpperCase()==='TOPLAM');
  const kiloCols = [3,7,9,11,15,17,19];
  const adetCols = [2,5,8,10,13,16,18];
  let somonKg = st ? kiloCols.reduce((s,i)=>s+(parseNum(st[i])||0),0) : 0;
  let somonCnt = st ? adetCols.reduce((s,i)=>s+(parseNum(st[i])||0),0) : 0;
  if (!somonKg) {
    // Fallback: sum system rows (ETAS 1, ETAS 2, ETAS 4, ETAS 5, …) the same way.
    // Exclude block-total rows like 'ETAS 2 TOPLAM' that also live in col A.
    const sysRows = somonRows
      .filter(r=>r[0]&&/^ETAS\s*\d/i.test(String(r[0]).trim())&&!/TOPLAM/i.test(String(r[0])));
    somonKg  = sysRows.reduce((s,r)=>s+kiloCols.reduce((t,i)=>t+(parseNum(r[i])||0),0),0);
    somonCnt = sysRows.reduce((s,r)=>s+adetCols.reduce((t,i)=>t+(parseNum(r[i])||0),0),0);
  }
  // Mersin: find Toplam row (c1='Toplam'), total is c8
  const mt = mersinRows.find(r=>r[1]&&r[1].trim()==='Toplam');
  const mersinKg = mt ? (parseNum(mt[8])||0) : mersinRows.filter(r=>r[1]&&/^Etas\s*\d/i.test(r[1].trim())).reduce((s,r)=>s+(parseNum(r[8])||0),0);
  return { somonKg, somonCnt, mersinKg };
}

function computeKarkBioTotals(bioRows) {
  // Biomass OZET (re-verified against the live sheet 21.07.2026):
  //   [0]=System, then Adet/Kilo pairs per bucket, [16]=TOPLAM Adet, [17]=TOPLAM Kilo.
  //   ⚠ Kilo columns are in KG (NOT grams — a ÷1000 here once showed 1,700 t as 1,701 kg).
  //   TOPLAM row includes all systems (incl. Incedere sistem, added Jul 2026).
  // Sterlet side block moved to cols 25-29: [25]=cage, [27]=Adet, [29]=Kg;
  //   the TOPLAM row carries sterlet totals in c27/c29.
  const toplamRow = bioRows.find(r=>r[0]&&r[0].trim()==='TOPLAM');
  const salmonKg  = toplamRow ? (parseNum(toplamRow[17])||0) : 0;
  const salmonCnt = toplamRow ? (parseNum(toplamRow[16])||0) : 0;
  const sterletCnt = toplamRow ? (parseNum(toplamRow[27])||0) : 0;
  const sterletKg  = toplamRow ? (parseNum(toplamRow[29])||0) : 0;
  return { salmonKg, sterletKg, salmonCnt, sterletCnt };
}

// ── DATE-RANGE CONTROL (shared by farm tabs + mortality tab) ───────────────
// rangeState[pid] = { range: {days:N} | {from,to} } — survives refresh re-renders.
const rangeState = {};
function rangeBarHtml(pid, activeDays) {
  const presets = [30, 60, 90, 0];
  return `<div class="range-bar" id="${pid}-rangebar">
    <span class="range-lbl">📅 Range</span>
    ${presets.map(d=>`<button class="range-btn${d===activeDays?' active':''}" data-days="${d}">${d===0?'All':d+'d'}</button>`).join('')}
    <input type="date" class="range-date" id="${pid}-range-from" title="From">
    <span style="color:#4a6080;font-size:11px">→</span>
    <input type="date" class="range-date" id="${pid}-range-to" title="To">
    <button class="range-btn" data-custom="1">Apply</button>
  </div>`;
}
function attachRangeBar(pid, redraw) {
  const bar = document.getElementById(`${pid}-rangebar`);
  if (!bar) return;
  bar.querySelectorAll('.range-btn[data-days]').forEach(b=>{
    b.onclick = () => {
      rangeState[pid].range = { days: +b.dataset.days };
      bar.querySelectorAll('.range-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      redraw();
    };
  });
  const applyBtn = bar.querySelector('.range-btn[data-custom]');
  if (applyBtn) applyBtn.onclick = () => {
    const f = document.getElementById(`${pid}-range-from`).value || null;
    const t = document.getElementById(`${pid}-range-to`).value || null;
    if (!f && !t) return;
    rangeState[pid].range = { from: f, to: t };
    bar.querySelectorAll('.range-btn').forEach(x=>x.classList.remove('active'));
    applyBtn.classList.add('active');
    redraw();
  };
}
// Returns [lo,hi) slice bounds over an ascending array of ISO dates (nulls allowed).
function sliceByRange(pid, isoDates) {
  const r = (rangeState[pid] && rangeState[pid].range) || { days: 60 };
  const n = isoDates.length;
  let lo = 0, hi = n;
  if (r.days != null) {
    if (r.days > 0) {
      const lastIso = [...isoDates].reverse().find(d=>d) || null;
      if (lastIso) {
        const cut = new Date(lastIso); cut.setDate(cut.getDate() - r.days + 1);
        const cutIso = cut.toISOString().slice(0,10);
        const i = isoDates.findIndex(d => d && d >= cutIso);
        if (i >= 0) lo = i;
      }
    }
  } else {
    if (r.from) { const i = isoDates.findIndex(d => d && d >= r.from); lo = i >= 0 ? i : n; }
    if (r.to) {
      hi = lo;
      for (let i = n - 1; i >= lo; i--) { if (isoDates[i] && isoDates[i] <= r.to) { hi = i + 1; break; } }
    }
  }
  return [lo, hi];
}

// ── RENDER: DAILY OPS ──────────────────────────────────────────────────────
function renderOps(pid, c, rows, headerRows, bioTotals, el, cageData) {
  cageData = cageData || {};
  const useCageMort = !!cageData.useCageMort;
  const useCageFeed = !!cageData.useCageFeed;
  const cageMortMap = useCageMort ? (cageData.mortByDate || {}) : {};
  const cageFeedMap = useCageFeed ? (cageData.feedByDate || {}) : {};
  // Cage mortality before cageMortFrom is ignored: the ETAS cage log's first days are a
  // migration backfill (23.04 carries a 56,585 lump covering the whole 17–23 Apr die-off,
  // while Günlük has the true 8-11k/day shape). Günlük is used for those early dates.
  const cageMortFrom = cageData.cageMortFrom || null;
  const cageMortAt = k => (k && cageMortMap[k] != null && (!cageMortFrom || k >= cageMortFrom)) ? cageMortMap[k] : null;
  const cageMortLast = lastCageDate(cageMortMap);
  const cageFeedLast = lastCageDate(cageFeedMap);
  const hasCageMort = Object.keys(cageMortMap).length > 0;
  const hasCageFeed = Object.keys(cageFeedMap).length > 0;

  const allDataRows = rows.slice(headerRows).filter(r => {
    if(!r[0]||!String(r[0]).trim()) return false;
    return true; // keep all rows with a date
  });
  // Filter to rows with actual data for charting
  // Now also include rows where cage-level data is available (Günlük can be 0/blank
  // while cage tracker has the truth — see methodology note in LIVE_DATA_HUB_OVERRIDE)
  const dataRows = allDataRows.filter(r => {
    const hasT = r[c.temperature]&&r[c.temperature]!=='';
    const hasO = r[c.oxygen]&&r[c.oxygen]!=='';
    const mort = r[c.somon_mort];
    const k = gunlukDateToISO(r[c.date], 2026);
    const hasCage = k && (cageMortAt(k) != null || cageFeedMap[k] != null);
    return hasT||hasO||(mort&&mort!==''&&mort!=='0')||hasCage;
  });

  // Full-history series — the visible window is cut by the range bar (default 60d).
  const lbl = dataRows.map(row=>String(row[c.date]||'').trim());
  const isoDates = dataRows.map(row=>gunlukDateToISO(row[c.date], 2026));
  const get = idx => dataRows.map(row=>colVal(row,idx));

  // For mortality + feed: cage-level data is PRIMARY; Günlük fills the gap on dates
  // where the cage tracker hasn't been populated yet (or pre-dates it).
  const sMortV = dataRows.map(row => {
    const cv = cageMortAt(gunlukDateToISO(row[c.date], 2026));
    if (cv != null) return cv;
    return colVal(row, c.somon_mort);
  });
  const feedV = dataRows.map(row => {
    const k = gunlukDateToISO(row[c.date], 2026);
    if (k && cageFeedMap[k] != null) return cageFeedMap[k];
    if (c.somon_feed != null) return colVal(row, c.somon_feed);
    if (c.total_feed != null) return colVal(row, c.total_feed);
    return null;
  });

  const tempV  = get(c.temperature);
  const oxyV   = get(c.oxygen);
  const mMortV = c.mersin_mort!=null ? get(c.mersin_mort) : [];
  const mFeedV = c.mersin_feed!=null ? get(c.mersin_feed) : [];
  const feedLbl = (hasCageFeed ? 'Somon Feed (cage)' : (c.total_feed!=null ? 'Total Feed' : 'Somon Feed'));
  const sMortLbl = hasCageMort ? 'Somon (cage)' : 'Somon';

  // ─ STALE-DATA NOTE ─ warn only when the last data date is older than yesterday.
  // (The Günlük sheets pre-create empty rows through 31 Dec, so "last row is blank"
  // is the normal state and must not trigger a warning.)
  const lastRow = dataRows.length ? dataRows[dataRows.length - 1] : null;
  const lastDate = lastRow ? String(lastRow[c.date]||'').trim() : '—';
  const lastIso = [...isoDates].reverse().find(d=>d) || null;
  const yd = new Date(Date.now() - 86400000);
  const yestISO = `${yd.getFullYear()}-${String(yd.getMonth()+1).padStart(2,'0')}-${String(yd.getDate()).padStart(2,'0')}`;
  const isFallback = !!lastIso && lastIso < yestISO;
  const dataDateNote = isFallback
    ? `<span style="color:#f6ad55;font-size:11px;margin-left:8px">⚠ Latest data from: <b>${lastDate}</b></span>`
    : `<span style="color:#4a6080;font-size:11px;margin-left:8px">Data as of: <b>${lastDate}</b></span>`;

  // Use computed bio totals instead of Günlük column (which is often empty/stale)
  const somonBioDisp  = bioTotals.somonKg  ? fmtTonnes(bioTotals.somonKg)  : '—';
  const sterletBioDisp = bioTotals.sterletKg ? fmtTonnes(bioTotals.sterletKg) : (bioTotals.mersinKg ? fmtTonnes(bioTotals.mersinKg) : '—');
  const somonBioLbl  = pid==='kark' ? 'Salmon Biomass'  : 'Somon Biomass';
  const sterletBioLbl = pid==='kark' ? 'Sterlet Biomass' : 'Mersin Biomass';

  const hasMersinMort = mMortV.some(v=>v!==null);
  const hasMersinFeed = mFeedV.some(v=>v!==null);

  // Cage-data source indicator — separate Mort + Feed since each can have its own source
  const mortSrcBadge = hasCageMort
    ? `<span style="color:#48bb78;font-size:11px;margin-left:6px;background:#0a3a1f;padding:2px 6px;border-radius:3px">📍 Mort: cage (last ${cageMortLast||'—'})</span>`
    : `<span style="color:#a0aec0;font-size:11px;margin-left:6px">Mort: Günlük</span>`;
  const feedSrcBadge = hasCageFeed
    ? `<span style="color:#48bb78;font-size:11px;margin-left:4px;background:#0a3a1f;padding:2px 6px;border-radius:3px">📍 Feed: cage (last ${cageFeedLast||'—'})</span>`
    : `<span style="color:#a0aec0;font-size:11px;margin-left:4px">Feed: Günlük</span>`;
  const cageBadge = mortSrcBadge + feedSrcBadge;

  let html = `<div class="section-label">📊 Daily Operations — ${dataRows.length} days logged ${dataDateNote} ${cageBadge}</div>
  <div class="kpi-grid">`;

  const kpis=[
    {lbl:'Temperature',unit:'°C',val:latestVal(tempV),vals:tempV,cls:'kpi-temp',bad:'up'},
    {lbl:'Oxygen',unit:'mg/L',val:latestVal(oxyV),vals:oxyV,cls:'kpi-oxy',bad:'down'},
    {lbl:hasCageMort?'Somon Ölü (cage)':'Somon Ölü',unit:'/day',val:latestVal(sMortV),vals:sMortV,cls:'kpi-mort',bad:'up'},
    {lbl:feedLbl,unit:'kg',val:latestVal(feedV),vals:feedV,cls:'kpi-feed',bad:'down'},
  ];
  kpis.forEach(k=>{
    const t=trendDir(k.vals||[]);
    const icon=t==='up'?'▲':t==='down'?'▼':'→';
    const tCls=t==='stable'?'tr-stable':(t===k.bad?'tr-bad':'tr-good');
    const disp=k.val!=null?k.val.toLocaleString('tr-TR',{maximumFractionDigits:1}):'—';
    const dateHint = isFallback ? `<div style="font-size:9px;color:#f6ad55;margin-top:2px">from ${lastDate}</div>` : '';
    html+=`<div class="kpi-card ${k.cls}">
      <div class="kpi-lbl">${k.lbl}</div>
      <div class="kpi-val">${disp}<span class="kpi-unit">${k.unit}</span></div>
      <div class="kpi-tr ${tCls}">${icon} ${t==='up'?'Rising':t==='down'?'Falling':'Stable'}</div>
      ${dateHint}
    </div>`;
  });

  // Biomass KPIs from detail page
  html += `
    <div class="kpi-card kpi-bio">
      <div class="kpi-lbl">${somonBioLbl}</div>
      <div class="kpi-val" style="font-size:18px">${somonBioDisp}</div>
      <div class="kpi-tr tr-stable">→ From biomass detail</div>
    </div>
    <div class="kpi-card kpi-bio">
      <div class="kpi-lbl">${sterletBioLbl}</div>
      <div class="kpi-val" style="font-size:18px">${sterletBioDisp}</div>
      <div class="kpi-tr tr-stable">→ From biomass detail</div>
    </div>`;

  html += '</div>';

  // Chart builders take a slicer so the range bar can redraw any window instantly.
  const chartDefs=[
    {id:`${pid}-temp`,title:'Temperature (°C)',sets:sl=>[ds('Temperature',sl(tempV),'#fc8181')]},
    {id:`${pid}-oxy`, title:'Oxygen (mg/L)',   sets:sl=>[ds('Oxygen',sl(oxyV),'#63b3ed')]},
    {id:`${pid}-mort`,title:'Daily Mortality', sets:sl=>[
      ds(sMortLbl,sl(sMortV),'#fc8181'),
      ...(hasMersinMort?[ds('Mersin',sl(mMortV),'#f6ad55',false,true)]:[])
    ]},
    {id:`${pid}-feed`,title:`Feed (kg)`,       sets:sl=>[
      ds(feedLbl,sl(feedV),'#b794f4'),
      ...(hasMersinFeed?[ds('Mersin Feed',sl(mFeedV),'#d6bcfa',false,true)]:[])
    ]},
  ];

  if (!rangeState[pid]) rangeState[pid] = {};
  if (!rangeState[pid].range) rangeState[pid].range = { days: 60 };
  html += rangeBarHtml(pid, rangeState[pid].range.days ?? null);
  html+='<div class="charts-grid">';
  chartDefs.forEach(def=>{
    html+=`<div class="chart-card"><div class="chart-title">${def.title}</div><div class="chart-wrap"><canvas id="${def.id}"></canvas></div></div>`;
  });
  html+='</div>';

  el.innerHTML+=html;
  const redraw = () => {
    const [lo,hi] = sliceByRange(pid, isoDates);
    const sl = a => a.slice(lo,hi);
    chartDefs.forEach(def=>makeChart(def.id, lbl.slice(lo,hi), def.sets(sl)));
  };
  rangeState[pid].redraw = redraw;
  setTimeout(()=>{ attachRangeBar(pid, redraw); redraw(); },60);
}

// ── RENDER: BIOMASS ETAS ────────────────────────────────────────────────────
function renderBioETAS(somonRows, mersinRows, el) {
  // ─ SOMON weight breakdown (v2 layout) ─
  // Row 2 is header: ['Sistem','','Adet','Kilo','Adet','Kilo',...] for 7 weight buckets
  // System rows have r[0] = 'ETAS 2', 'ETAS 4', 'ETAS 5', etc.
  // Adet cols: 2,5,8,10,13,16,18  Kilo cols: 3,7,9,11,15,17,19 (v2 summary has gap cols E/G/M/O)
  // Only rows ABOVE the summary TOPLAM row — col A further down holds block labels
  // ('ETAS 2' at row 12) and block totals ('ETAS 2 TOPLAM') that must not be summed.
  const sTopIdx = somonRows.findIndex(r=>r[0]&&String(r[0]).trim().toUpperCase()==='TOPLAM');
  const sSearch = sTopIdx>0 ? somonRows.slice(0,sTopIdx) : somonRows;
  const sRows = sSearch.filter(r=>r[0]&&/^ETAS\s*\d/i.test(String(r[0]).trim())&&!/TOPLAM/i.test(String(r[0])));
  const sLabels = ['0 – 200 g','200 – 500 g','500 – 1000 g','1000 – 1500 g','1500 – 2500 g','2500 – 3500 g','3500 g +'];
  const sKgCols  = [3,7,9,11,15,17,19];
  const sCntCols = [2,5,8,10,13,16,18];

  const sSumKg  = sKgCols.map(ci => sRows.reduce((s,r)=>s+(parseNum(r[ci])||0),0));
  const sSumCnt = sCntCols.map(ci => sRows.reduce((s,r)=>s+(parseNum(r[ci])||0),0));
  const sTotalKg  = sSumKg.reduce((a,b)=>a+b,0);
  const sTotalCnt = sSumCnt.reduce((a,b)=>a+b,0);

  // ─ MERSIN weight breakdown ─
  // Count cols (BIG fish): c15=<5kg, c16=5-15kg, c17=15-40kg, c18=40-70kg, c19=70-100kg, c20=100kg+
  // Total KG: c8
  const mRows = mersinRows.filter(r=>r[1]&&/^Etas\s*\d/i.test(r[1].trim()));
  const mLabels = ['< 5 kg','5 – 15 kg','15 – 40 kg','40 – 70 kg','70 – 100 kg','100 kg +'];
  const mCntCols = [15,16,17,18,19,20];

  const mSumCnt = mCntCols.map(ci => mRows.reduce((s,r)=>s+(parseNum(r[ci])||0),0));
  const mTotalKg  = mRows.reduce((s,r)=>s+(parseNum(r[8])||0),0);
  const mTotalCnt = mSumCnt.reduce((a,b)=>a+b,0);

  let html = `<div class="section-label">🔬 Biomass Detail</div><div class="bio-panels">`;

  // Salmon panel
  html += buildWeightPanel('🐟','Salmon (Somon)', sTotalKg, sTotalCnt,
    sLabels, sSumCnt, sSumKg, sTotalCnt, sTotalKg, true);

  // Sturgeon panel (count breakdown by big-fish weight categories, kg totals from c8)
  html += `<div class="bio-panel">
    <div class="bio-panel-head">
      <span class="bio-icon">🦈</span>
      <span class="bio-title">Sturgeon (Mersin)</span>
      <span class="bio-badge">${fmtCnt(mTotalCnt)} fish · ${fmtTonnes(mTotalKg)}</span>
    </div>
    <div class="bio-sub">🔵 Fish count &nbsp;·&nbsp; Weight categories in kg (large sturgeon)</div>
    <div class="wb-table">`;

  const mMaxCnt = Math.max(...mSumCnt, 1);
  mLabels.forEach((lbl,i)=>{
    const cnt = mSumCnt[i];
    const cntPct = Math.max((cnt/mMaxCnt)*100, cnt>0?2:0);
    html += `<div class="wb-row">
      <div class="wb-label">${lbl}</div>
      <div class="wb-bars">
        <div class="wb-bar-wrap">
          <div class="wb-track"><div class="wb-fill-count" style="height:100%;width:${cntPct.toFixed(1)}%;min-width:${cnt>0?1:0}px;background:#63b3ed;border-radius:3px;"></div></div>
          <span class="wb-tiny" style="color:#63b3ed">${cnt>0?fmtCnt(cnt):'—'}</span>
        </div>
      </div>
      <div class="wb-vals"><span class="wb-count-val">${cnt>0?fmtCnt(cnt):'—'}</span></div>
    </div>`;
  });

  html += `</div></div>`;
  html += '</div>';
  el.innerHTML += html;
}

// ── RENDER: BIOMASS KARK ────────────────────────────────────────────────────
function renderBioKark(bioRows, el) {
  // Biomass OZET (re-verified 21.07.2026):
  // Weight categories (paired Adet/Kilo cols):
  //   col 2/3: 0-200g, 4/5: 200-500g, 6/7: 500-1000g, 8/9: 1000-1500g
  //   10/11: 1500-2500g, 12/13: 2500-3500g, 14/15: 3500+g, 16/17: TOPLAM
  // ⚠ Kilo values are KG (not grams). System rows are read dynamically from above the
  // TOPLAM row so new systems (Incedere sistem, Jul 2026) are included automatically;
  // col-A cells BELOW the TOPLAM row are per-cage block labels and must not be summed.
  // Sterlet side block: cols 25-29 (cage / note / Adet / Ort Kg / Kg); totals on TOPLAM row c27/c29.
  const topIdx = bioRows.findIndex(r=>r[0]&&r[0].trim()==='TOPLAM');
  const searchRows = topIdx>0 ? bioRows.slice(0,topIdx) : bioRows;
  const salmonRows = searchRows.filter(r=>r[0]&&/sistem/i.test(String(r[0]))&&String(r[0]).trim().toLowerCase()!=='sistem');
  const toplamRow  = topIdx>=0 ? bioRows[topIdx] : null;

  const sLabels   = ['0 – 200 g','200 – 500 g','500g – 1 kg','1 – 1.5 kg','1.5 – 2.5 kg','2.5 – 3.5 kg','3.5 kg +'];
  const sCntCols  = [2,4,6,8,10,12,14];
  const sKgCols   = [3,5,7,9,11,13,15];

  // Salmon: sum all systems (values already in kg)
  const sSumCnt = sCntCols.map(ci=>salmonRows.reduce((s,r)=>s+(parseNum(r[ci])||0),0));
  const sSumKg  = sKgCols.map(ci=>Math.round(salmonRows.reduce((s,r)=>s+(parseNum(r[ci])||0),0)));
  const sTotalKg  = sSumKg.reduce((a,b)=>a+b,0);
  const sTotalCnt = sSumCnt.reduce((a,b)=>a+b,0);

  // Sterlet: side block D-cages (col 25 = cage, 27 = adet, 29 = kg)
  const sterletCages = bioRows.filter(r=>r[25]&&/^D\d/.test(String(r[25]).trim()));
  const sterletTotalCnt = toplamRow ? (parseNum(toplamRow[27])||0) : 0;
  const sterletTotalKg  = toplamRow ? Math.round(parseNum(toplamRow[29])||0) : 0;
  const sterletAvgG = sterletTotalCnt>0 ? Math.round(sterletTotalKg*1000/sterletTotalCnt) : 0;

  let html = `<div class="section-label">🔬 Biomass Detail</div><div class="bio-panels">`;

  // Salmon panel — all 4 systems combined
  html += buildWeightPanel('🐟','Salmon (All Systems)', sTotalKg, sTotalCnt,
    sLabels, sSumCnt, sSumKg, sTotalCnt, sTotalKg, true);

  // Sterlet panel — summary + per-cage breakdown
  html += `<div class="bio-panel">
    <div class="bio-panel-head">
      <span class="bio-icon">🦈</span>
      <span class="bio-title">Sterlet (Mersin Cages)</span>
      <span class="bio-badge">${fmtCnt(sterletTotalCnt)} fish · ${fmtTonnes(sterletTotalKg)}</span>
    </div>
    <div class="sterlet-summary">
      <div class="st-stat">
        <div class="st-stat-val">${Math.round(sterletTotalCnt).toLocaleString('tr-TR')}</div>
        <div class="st-stat-lbl">Total Fish</div>
      </div>
      <div class="st-stat">
        <div class="st-stat-val">${sterletAvgG>0 ? sterletAvgG.toLocaleString('tr-TR')+' g' : '—'}</div>
        <div class="st-stat-lbl">Avg Weight</div>
      </div>
      <div class="st-stat">
        <div class="st-stat-val">${Math.round(sterletTotalKg).toLocaleString('tr-TR')}</div>
        <div class="st-stat-lbl">Total kg</div>
      </div>
    </div>`;

  // Per-cage rows for sterlet
  if(sterletCages.length) {
    html += `<div class="bio-sub">Per-cage breakdown (D-cages)</div><div class="wb-table">`;
    const maxCageKg = Math.max(...sterletCages.map(r=>Math.round(parseNum(r[29])||0)), 1);
    sterletCages.forEach(r=>{
      const cage = String(r[25]).trim();
      const label = String(r[26]||'').trim();
      const cnt = parseNum(r[27])||0;
      const kg = Math.round(parseNum(r[29])||0);
      const pct = Math.max((kg/maxCageKg)*100, kg>0?2:0);
      html += `<div class="wb-row">
        <div class="wb-label">${cage} <span style="color:#4a6080;font-size:9px">${label}</span></div>
        <div class="wb-bars">
          <div class="wb-bar-wrap">
            <div class="wb-track"><div class="wb-fill-kg" style="height:100%;width:${pct.toFixed(1)}%;min-width:${kg>0?1:0}px;background:#68d391;border-radius:3px;"></div></div>
            <span class="wb-tiny" style="color:#68d391">${kg>0?fmtKg(kg)+' kg':'—'}</span>
          </div>
        </div>
        <div class="wb-vals">
          <span class="wb-count-val">${cnt>0?fmtCnt(cnt)+' fish':'—'}</span>
          <span class="wb-kg-val">${kg>0?fmtKg(kg)+' kg':'—'}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  html += '</div>';
  el.innerHTML += html;
}

// ── SHARED: Weight panel builder ───────────────────────────────────────────
function buildWeightPanel(icon, title, totalKg, totalCnt, labels, cntArr, kgArr, maxCnt, maxKg, showKg) {
  const maxC = Math.max(...cntArr, 1);
  const maxK = Math.max(...kgArr, 1);
  let html = `<div class="bio-panel">
    <div class="bio-panel-head">
      <span class="bio-icon">${icon}</span>
      <span class="bio-title">${title}</span>
      <span class="bio-badge">${fmtCnt(totalCnt)} fish · ${fmtTonnes(totalKg)}</span>
    </div>
    <div class="bio-sub">🔵 Fish count &nbsp;·&nbsp; 🟠 Biomass kg</div>
    <div class="wb-table">`;

  labels.forEach((lbl,i)=>{
    const cnt = cntArr[i];
    const kg  = kgArr[i];
    const cPct = Math.max((cnt/maxC)*100, cnt>0?1.5:0);
    const kPct = Math.max((kg/maxK)*100, kg>0?1.5:0);
    html += `<div class="wb-row">
      <div class="wb-label">${lbl}</div>
      <div class="wb-bars">
        <div class="wb-bar-wrap">
          <div class="wb-track"><div class="wb-fill-count" style="height:100%;width:${cPct.toFixed(1)}%;min-width:${cnt>0?1:0}px;background:#63b3ed;border-radius:3px;"></div></div>
          <span class="wb-tiny" style="color:#63b3ed">${cnt>0?fmtCnt(cnt):'—'}</span>
        </div>
        ${showKg?`<div class="wb-bar-wrap">
          <div class="wb-track"><div class="wb-fill-kg" style="height:100%;width:${kPct.toFixed(1)}%;min-width:${kg>0?1:0}px;background:#f6ad55;border-radius:3px;"></div></div>
          <span class="wb-tiny" style="color:#f6ad55">${kg>0?fmtKg(kg)+' kg':'—'}</span>
        </div>`:''}
      </div>
      <div class="wb-vals">
        <span class="wb-count-val">${cnt>0?fmtCnt(cnt):'—'}</span>
        ${showKg?`<span class="wb-kg-val">${kg>0?fmtKg(kg)+' kg':'—'}</span>`:''}
      </div>
    </div>`;
  });

  html += `</div></div>`;
  return html;
}

// ── RENDER: FEED STORAGE ───────────────────────────────────────────────────
function getLatestDepo(rows) {
  // Only DATED rows count. Undated trailing rows are grand totals — e.g. Karkamış YEM's
  // last row holds YTD consumption (~2,024 t), which is NOT the depo stock (~585 t).
  for(let i=rows.length-1;i>=0;i--){
    const r=rows[i];
    if(!r||!r.length) continue;
    if(!r[0]||!String(r[0]).trim()) continue;
    const v=parseNum(r[r.length-1]);
    if(v!=null&&v>1000) return v;
  }
  return null;
}

function renderHasat(pid, hasat, hasatCfg, el) {

    const d=r[h.date];const kg=r[h.kg];
    return d&&d.trim()&&kg&&kg.trim()&&parseNum(kg)>0;
  });
  if(!data.length){
    el.innerHTML+=`<div class="section-label">🎣 Hasat (Harvest)</div><p style="color:#4a6080;font-size:13px;padding:8px 0">No harvest data.</p>`;
    return;
  }
  const byMonth={};
  data.forEach(r=>{
    const dt=parseHasatDate(r[h.date],h.dateFormat);
    const mk=monthKey(dt);
    if(!mk) return;
    const kg=parseNum(r[h.kg])||0;
    if(!byMonth[mk]) byMonth[mk]={kg:0,month:TR_MONTHS[dt.getMonth()]};
    byMonth[mk].kg+=kg;
  });
  const months=Object.keys(byMonth).sort();
  const monthKg=months.map(m=>Math.round(byMonth[m].kg));
  const monthLabels=months.map(m=>byMonth[m].month);

  const byCustomer={};
  data.forEach(r=>{
    const c=(r[h.customer]||'Bilinmeyen').trim();
    const kg=parseNum(r[h.kg])||0;
    byCustomer[c]=(byCustomer[c]||0)+kg;
  });
  const ytdKg=Object.values(byCustomer).reduce((a,b)=>a+b,0);
  const curKey=monthKey(new Date());
  const thisMonthKg=byMonth[curKey]?.kg||0;

  const sorted=Object.entries(byCustomer).sort((a,b)=>b[1]-a[1]);
  const top5=sorted.slice(0,5);
  const othersKg=sorted.slice(5).reduce((s,[,v])=>s+v,0);
  if(othersKg>0) top5.push(['Diğerleri',othersKg]);

  let html=`<div class="section-label">🎣 Hasat (Harvest)</div>
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi-card kpi-hasat">
      <div class="kpi-lbl">This Month</div>
      <div class="kpi-val">${Math.round(thisMonthKg).toLocaleString('tr-TR')}<span class="kpi-unit">kg</span></div>
      <div class="kpi-tr tr-good">↑ ${months.length} months active</div>
    </div>
    <div class="kpi-card kpi-hasat">
      <div class="kpi-lbl">YTD Total</div>
      <div class="kpi-val">${Math.round(ytdKg).toLocaleString('tr-TR')}<span class="kpi-unit">kg</span></div>
      <div class="kpi-tr tr-stable">→ ${data.length} transactions</div>
    </div>
  </div>
  <div class="hasat-grid">
    <div class="chart-card">
      <div class="chart-title">Monthly Harvest (kg)</div>
      <div class="chart-wrap"><canvas id="${pid}-hasat-chart"></canvas></div>
    </div>
    <div class="hasat-table-card">
      <div class="hasat-table-title">Sales by Customer — YTD</div>
      <table>
        <thead><tr><th>Customer</th><th style="text-align:right">Total kg</th><th>Share</th></tr></thead>
        <tbody>`;

  top5.forEach(([cust,kg])=>{
    const share=ytdKg>0?((kg/ytdKg)*100).toFixed(1):'0';
    const barW=Math.min(parseFloat(share)*0.9,90);
    html+=`<tr>
      <td class="td-cust ${cust==='Diğerleri'?'td-others':''}">${cust}</td>
      <td class="td-kg">${Math.round(kg).toLocaleString('tr-TR')}</td>
      <td>
        <div class="share-bar-wrap">
          <div class="share-bar" style="width:${barW}px"></div>
          <span class="share-pct">${share}%</span>
        </div>
      </td>
    </tr>`;
  });

  html+=`</tbody></table></div></div>`;
  el.innerHTML+=html;
  setTimeout(()=>{
    makeChart(`${pid}-hasat-chart`,monthLabels,[dsBar('Harvest kg',monthKg,'#68d391')],'bar',{maxX:12});
  },80);
}

// ── FORMAT CURRENCY ────────────────────────────────────────────────────────
function fmtUSD(v) {
  if (typeof v === 'number') {
    if (isNaN(v)) return '$0';
    return '$' + Math.round(v).toLocaleString('tr-TR');
  }
  const n = parseNum(v);
  if (n == null) return '$0';
  return '$' + Math.round(n).toLocaleString('tr-TR');
}

// Recalculate all financial values
function recalcFinancials() {
  const totalAssets = finData.bankBalance + finData.receivables + finData.checks;
  const netCash = totalAssets - finData.payables;

  const totalSalmon = finData.etasSomonBio + finData.karkSalmonBio;
  const totalSturgeon = finData.etasMersinBio + finData.karkSterletBio;
  const salmonValue = totalSalmon * finData.salmonPrice;
  const sturgeonValue = totalSturgeon * finData.sturgeonPrice;
  const stockValue = salmonValue + sturgeonValue;

  const totalFeed = finData.etasSomonFeed + finData.etasMersinFeed + finData.karkFeed;
  const feedValue = totalFeed * finData.feedPrice;

  const totalEquity = netCash + stockValue + feedValue;

  // Helper to set element text
  const set = (id, txt) => { const e=document.getElementById(id); if(e) e.textContent=txt; };
  const setColor = (id, color) => { const e=document.getElementById(id); if(e) e.style.color=color; };

  // Cash section — breakdown lines
  set('fin-recv-line', fmtUSD(finData.receivables));
  set('fin-bank-line', fmtUSD(finData.bankBalance));
  set('fin-checks-line', fmtUSD(finData.checks));
  set('fin-total-assets', fmtUSD(totalAssets));
  set('fin-payables-line', fmtUSD(finData.payables));
  set('fin-net-cash', fmtUSD(netCash));
  setColor('fin-net-cash', netCash >= 0 ? '#68d391' : '#fc8181');

  // Biomass section (values are kg; shown as tonnes)
  set('fin-total-salmon', fmtTonnes(totalSalmon));
  set('fin-salmon-value', fmtUSD(salmonValue));
  set('fin-total-sturgeon', fmtTonnes(totalSturgeon));
  set('fin-sturgeon-value', fmtUSD(sturgeonValue));

  // Feed section
  set('fin-total-feed', fmtTonnes(totalFeed));
  set('fin-feed-value', fmtUSD(feedValue));

  // Grand summary
  set('fin-nc-summary', fmtUSD(netCash));
  setColor('fin-nc-summary', netCash >= 0 ? '#68d391' : '#fc8181');
  set('fin-sv-salmon-summary', fmtUSD(salmonValue));
  set('fin-sv-sturgeon-summary', fmtUSD(sturgeonValue));
  set('fin-fv-summary', fmtUSD(feedValue));

  const gv = document.getElementById('fin-grand-value');
  if (gv) {
    gv.textContent = fmtUSD(totalEquity);
    gv.className = 'fin-grand-value ' + (totalEquity > 0 ? 'positive' : totalEquity < 0 ? 'negative' : 'neutral');
  }
}

const _liveFarm = { etas: null, kark: null };
async function getLiveFarmStats() {
  if (_liveFarm.etas && _liveFarm.kark) return _liveFarm;
  const ID_ETAS = '1d5auEs3o0st7z3Bt46uuVzuHK0Bw-K70Lb1R5m4ok4Y';
  const ID_KARK = '15Ck8hhqdYMsmBju1wTznQOsiNuEFQPMg_y3X7sCTA4o';
  const [eBio, eMersin, eOlum, kBio, kOlum] = await Promise.all([
    api(ID_ETAS,'Somon Biomass v2').then(normalizeETAS),
    api(ID_ETAS,'Mersin Biomass').then(normalizeETAS),
    api(ID_ETAS,'Olum-kafes baz').then(normalizeETAS),
    api(ID_KARK,'Biomass'),
    api(ID_KARK,'Olum-kafes baz'),
  ]);
  const eb = computeBioTotals(eBio, eMersin);
  const kb = computeKarkBioTotals(kBio);
  _liveFarm.etas = { fish: eb.somonCnt, kg: eb.somonKg, mortByDate: aggCageByDate(eOlum,3), mortFrom: '2026-04-24' };
  _liveFarm.kark = { fish: kb.salmonCnt, kg: kb.salmonKg, mortByDate: aggCageByDate(kOlum,3), mortFrom: null };
  return _liveFarm;
}

async function loadMortality() {
  const el = document.getElementById('page-mort');
  el.innerHTML='<div class="loading"><div class="spin"></div>Loading Mortality & Stock…</div>';
  // Try the live JSON first (fresh on GitHub Pages); fall back to embedded data so the
  // page also works when opened as a local file:// (where fetching a local file is blocked).
  let d = null;
  try {
    const resp = await fetch('mortality_snapshot.json?t='+Date.now());
    if(resp.ok) d = await resp.json();
  } catch(e) { /* file:// or offline — use embedded */ }
  if(!d) d = (typeof EMBEDDED_MORTALITY_DATA!=='undefined') ? JSON.parse(JSON.stringify(EMBEDDED_MORTALITY_DATA)) : null;
  if(!d) {
    el.innerHTML='<div class="err">❌ No mortality data. It is generated by the daily snapshot task (farm_snapshot.py).</div>';
    return;
  }
  d.history = d.history || [];
  // The by-system / by-weight panels stay snapshot-based — remember their data date.
  const snapDate = { etas: d.farms?.etas?.date || '—', kark: d.farms?.kark?.date || '—' };

  // ── LIVE OVERLAY ── today's mortality + stock straight from the sheets, so KPIs are
  // never stale when the snapshot task hasn't fired. Also fills the daily-deaths series
  // from the cage logs for days the snapshot task missed.
  let liveErr = null;
  try {
    const live = await getLiveFarmStats();
    const byDate = {};
    d.history.forEach(h => byDate[h.date] = h);
    for (const fa of ['etas','kark']) {
      const L = live[fa];
      if (!L || !L.mortByDate) continue;
      Object.keys(L.mortByDate).forEach(k => {
        if (L.mortFrom && k < L.mortFrom) return;
        const h = byDate[k] || (byDate[k] = { date: k });
        if (h[fa+'_mort'] == null) h[fa+'_mort'] = Math.round(L.mortByDate[k]);
      });
      const md = lastCageDate(L.mortByDate);
      if (!md) continue;
      const mort = Math.round(L.mortByDate[md]);
      const per10k = L.fish ? +(mort / L.fish * 10000).toFixed(2) : 0;
      const h = byDate[md] || (byDate[md] = { date: md });
      h[fa+'_mort'] = mort; h[fa+'_per10k'] = per10k;
      h[fa+'_fish'] = Math.round(L.fish); h[fa+'_kg'] = Math.round(L.kg);
      d.farms[fa] = { ...(d.farms[fa]||{}), farm: fa==='etas'?'Elazig':'Karkamis',
        date: md, total_fish: Math.round(L.fish), total_kg: Math.round(L.kg),
        mortality: mort, per10k: per10k, live: true };
    }
    d.history = Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);
  } catch(e) { liveErr = e; }

  const E = d.farms.etas, K = d.farms.kark;
  const fmt = n => (n==null?'—':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:n<100?2:0}));
  const upd = new Date(d.lastUpdated);
  const todayISO = (()=>{ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; })();
  const liveNote = f => f.live
    ? `<span style="color:#48bb78">● live from sheets${f.date===todayISO?' · today, still logging':''}</span>`
    : `<span style="color:#f6ad55">⚠ snapshot only (${f.date||'—'})</span>`;

  let html = `<div class="section-label">📉 Mortality Rate — deaths per 10,000 fish · normalized by live stock · snapshot ${upd.toLocaleDateString('tr-TR')}${liveErr?' · <span style=\"color:#f6ad55\">live refresh failed — showing snapshot</span>':''}</div>
  <div class="kpi-grid">
    <div class="kpi-card kpi-mort">
      <div class="kpi-lbl">Elazığ — per 10k</div>
      <div class="kpi-val">${fmt(E.per10k)}<span class="kpi-unit">/10k</span></div>
      <div class="kpi-tr tr-stable">${fmt(E.mortality)} deaths · ${(E.total_fish/1000).toFixed(0)}k fish · ${E.date}</div>
      <div class="kpi-tr">${liveNote(E)}</div>
    </div>
    <div class="kpi-card kpi-mort" style="--bar:#68d391">
      <div class="kpi-lbl">Karkamış — per 10k</div>
      <div class="kpi-val">${fmt(K.per10k)}<span class="kpi-unit">/10k</span></div>
      <div class="kpi-tr tr-stable">${fmt(K.mortality)} deaths · ${(K.total_fish/1000).toFixed(0)}k fish · ${K.date}</div>
      <div class="kpi-tr">${liveNote(K)}</div>
    </div>
    <div class="kpi-card kpi-bio">
      <div class="kpi-lbl">Elazığ vs Karkamış</div>
      <div class="kpi-val" style="font-size:20px">${(E.per10k/Math.max(K.per10k,0.001)).toFixed(1)}×</div>
      <div class="kpi-tr ${E.per10k>K.per10k?'tr-bad':'tr-good'}">${E.per10k>K.per10k?'Elazığ higher':'Karkamış higher'}</div>
    </div>
    <div class="kpi-card kpi-bio">
      <div class="kpi-lbl">Salmon Stock (both farms)</div>
      <div class="kpi-val" style="font-size:18px">${((E.total_fish+K.total_fish)/1e6).toFixed(2)}<span class="kpi-unit">M fish</span></div>
      <div class="kpi-tr tr-stable">→ ${fmt(Math.round((E.total_kg+K.total_kg)/1000))} t biomass</div>
    </div>
  </div>`;

  // range bar + time-series charts (per10k, absolute deaths, stock count, stock tonnes)
  html += rangeBarHtml('mort', (rangeState['mort']&&rangeState['mort'].range&&rangeState['mort'].range.days!=null)?rangeState['mort'].range.days:0);
  html += '<div class="charts-grid">';
  html += `<div class="chart-card"><div class="chart-title">Mortality Rate Trend (per 10k)</div><div class="chart-wrap"><canvas id="mort-trend"></canvas></div></div>`;
  html += `<div class="chart-card"><div class="chart-title">Daily Deaths (absolute · cage logs)</div><div class="chart-wrap"><canvas id="mort-abs"></canvas></div></div>`;
  html += `<div class="chart-card"><div class="chart-title">Salmon Stock — fish count</div><div class="chart-wrap"><canvas id="stock-count"></canvas></div></div>`;
  html += `<div class="chart-card"><div class="chart-title">Salmon Biomass — tonnes</div><div class="chart-wrap"><canvas id="stock-tonnes"></canvas></div></div>`;
  html += '</div>';

  // snapshot-based breakdowns
  html += `<div class="section-label" style="margin-top:18px">🔎 Breakdowns — from daily snapshot (Elazığ ${snapDate.etas} · Karkamış ${snapDate.kark})</div>`;
  html += '<div class="charts-grid">';
  html += `<div class="chart-card"><div class="chart-title">By System — per 10k</div><div class="chart-wrap"><canvas id="mort-sys"></canvas></div></div>`;
  html += `<div class="chart-card"><div class="chart-title">By Weight Class — per 10k</div><div class="chart-wrap"><canvas id="mort-weight"></canvas></div></div>`;
  html += '</div>';

  // note about weight-class measurement quality + stock-history provenance
  const wmE = E.weightMeasuredPct, wmK = K.weightMeasuredPct;
  html += `<div class="section-label" style="margin-top:14px;font-size:11px;color:#a0aec0">
    ⓘ Weight-class split is <b>measured</b> when the mortality log's avg-weight (gram) column is filled;
    otherwise it is <b>estimated</b> from each system's size profile. Measured coverage at snapshot —
    Elazığ ${wmE??'—'}%, Karkamış ${wmK??'—'}%. Stock history comes from the daily snapshot
    (biomass tabs overwrite — days without a snapshot run have no stock point); today's point is live.
    Per-system &amp; per-size history: MORTALITY_BY_SYSTEM.csv / SIZE_BREAKDOWN_SNAPSHOT.csv in Claude raw knowledge.</div>`;

  el.innerHTML = html;

  setTimeout(()=>{
    const hist = d.history||[];
    const isoDates = hist.map(h=>h.date);
    if (!rangeState['mort']) rangeState['mort'] = {};
    if (!rangeState['mort'].range) rangeState['mort'].range = { days: 0 };
    const redraw = () => {
      const [lo,hi] = sliceByRange('mort', isoDates);
      const hs = hist.slice(lo,hi);
      const labels = hs.map(h=>h.date);
      makeChart('mort-trend', labels, [
        ds('Elazığ', hs.map(h=>h.etas_per10k??null), '#fc8181'),
        ds('Karkamış', hs.map(h=>h.kark_per10k??null), '#68d391'),
      ]);
      makeChart('mort-abs', labels, [
        ds('Elazığ', hs.map(h=>h.etas_mort??null), '#fc8181'),
        ds('Karkamış', hs.map(h=>h.kark_mort??null), '#68d391'),
      ]);
      makeChart('stock-count', labels, [
        ds('Elazığ', hs.map(h=>h.etas_fish??null), '#fc8181'),
        ds('Karkamış', hs.map(h=>h.kark_fish??null), '#68d391'),
      ]);
      makeChart('stock-tonnes', labels, [
        ds('Elazığ', hs.map(h=>h.etas_kg!=null?+(h.etas_kg/1000).toFixed(1):null), '#fc8181'),
        ds('Karkamış', hs.map(h=>h.kark_kg!=null?+(h.kark_kg/1000).toFixed(1):null), '#68d391'),
      ]);
    };
    attachRangeBar('mort', redraw);
    redraw();
    // by system (both farms, sorted desc) — snapshot-based
    const sys = [...(d.systems.etas||[]).map(s=>({...s,farm:'Elazığ',c:'#fc8181'})),
                 ...(d.systems.kark||[]).map(s=>({...s,farm:'Karkamış',c:'#68d391'}))]
                 .sort((a,b)=>b.per10k-a.per10k);
    makeChart('mort-sys', sys.map(s=>`${s.system} (${s.farm.slice(0,3)})`),
      [dsBar('per 10k', sys.map(s=>s.per10k), '#f6ad55')], 'bar', {});
    // by weight class
    const buckets = ['0-200g','200-500g','500-1000g','1000-1500g','1500-2500g','2500-3500g','3500g+'];
    const wE = Object.fromEntries((d.weightClass.etas||[]).map(w=>[w.bucket,w.per10k]));
    const wK = Object.fromEntries((d.weightClass.kark||[]).map(w=>[w.bucket,w.per10k]));
    makeChart('mort-weight', buckets, [
      dsBar('Elazığ', buckets.map(b=>wE[b]??null), '#fc8181'),
      dsBar('Karkamış', buckets.map(b=>wK[b]??null), '#68d391'),
    ], 'bar', {});
  },60);
}
